# RICK Control Center — local development services
# Starts a PostgreSQL 16 instance for local development and migration testing.
# Credentials here are local-only placeholders; never use these in production.
#
# Usage:
#   docker compose up -d          # start in background
#   docker compose down           # stop and remove containers (data volume is preserved)
#   docker compose down -v        # stop and remove containers AND data volume (clean slate)
#
# NDERCC-4: persistence foundation — sprint 0.

services:
  postgres:
    image: postgres:16-alpine
    container_name: rick_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rick
      POSTGRES_PASSWORD: rick
      POSTGRES_DB: rick_dev
    ports:
      - "5432:5432"
    volumes:
      - rick_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rick -d rick_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  rick_postgres_data:
    driver: local
